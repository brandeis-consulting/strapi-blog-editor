services:
  blog-editor:
    build: .
    image: brandeis/blog-editor:latest
    # Image wird lokal aus dem Repo gebaut, nie aus einer Registry gepullt —
    # sonst scheitert Portainers "compose pull" (brandeis/blog-editor liegt
    # nicht auf Docker Hub).
    pull_policy: build
    container_name: brandeis-blog-editor
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STRAPI_URL: ${STRAPI_URL:-https://cms.brandeis.de}
      PORT: 3000
      UPLOAD_FOLDER_ID: ${UPLOAD_FOLDER_ID:-}
    networks:
      - caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

# Externes Docker-Netzwerk, das vom zentralen Caddy-Stack bereitgestellt wird.
# Caddy proxiet anhand des im Caddyfile-Block hinterlegten Hostnamens hierher.
# Der Caddy-Stack wird separat aus dem Repo `caddy-config` deployt.
networks:
  caddy:
    external: true
