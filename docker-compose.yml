services:
  blog-editor:
    build: .
    image: brandeis/blog-editor:latest
    container_name: brandeis-blog-editor
    restart: unless-stopped
    environment:
      NODE_ENV: production
      STRAPI_URL: ${STRAPI_URL:-https://cms.brandeis.de}
      PORT: 3000
    ports:
      - "${HOST_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
